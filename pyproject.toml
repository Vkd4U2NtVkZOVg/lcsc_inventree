[project]
name = "lcsc2inventree"
version = "0.1.0"
description = "将立创商城（LCSC）商品信息自动导入 InvenTree 的命令行工具"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "lcsc2inventree contributors" },
]
keywords = ["lcsc", "inventree", "electronics", "inventory", "bom"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "inventree>=0.13",
    "click>=8.1",
    "pydantic>=2.5",
    "thefuzz>=0.20",
    "python-levenshtein>=0.25",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "tenacity>=8.2",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "respx>=0.21",
    "types-requests",
    "types-PyYAML",
]

[project.scripts]
lcsc2inv = "lcsc2inv.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/lcsc2inventree"
Issues = "https://github.com/your-org/lcsc2inventree/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lcsc2inv"]

# ---- Tooling --------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008", "N802"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["lcsc2inv"]
omit = ["*/tests/*"]