# LCSC `additionalProperty[].name` → InvenTree `PartParameterTemplate.name`
#
# 顶层 key 是 InvenTree 类别路径的"最后一段"或 LCSC 大类名。
# `parent: [...]` 表示继承另一个类别的字段映射（顺序：先父后子，子可覆盖父）。
# value 是 LCSC 字段名的列表，按顺序尝试匹配，第一个存在的字段被使用。
#
# 注意：如果同一 LCSC 字段名在多个 chain 中都声明，先出现的 chain 优先。

Base:
  # Value 放 Base（所有链路必含）：只要商品带 Resistance/Capacitance/Inductance
  # 参数就写值，未匹配分类的零件（如国内站中文分类）也不会漏
  Value:          [Resistance, Capacitance, Inductance]
  Tolerance:      [Tolerance]
  Rated Voltage:  ["Voltage Rating", "Voltage - Rated", "Rated Voltage"]
  Rated Current:  ["Current Rating", "Rated Current"]
  Rated Power:    ["Power(Watts)", "Power Rating", "Rated Power"]
  Package:        [Package, 封装, "Package Type"]
  Operating Temperature: [Operating Temperature]

# Passives：基本元件（电阻/电容/电感）共用 Value 字段（继承自 Base）
Passives:
  parent: [Base]

Resistors:
  parent: [Passives]
  # Rated Power 已通过 Base 继承，LCSC 字段名是 "Power(Watts)"

Capacitors:
  parent: [Passives]
  Rated Voltage:  ["Voltage Rating", "Voltage - Rated"]
  ESR:            [ESR]

Inductors:
  parent: [Passives]
  DC Resistance:  ["DC Resistance (DCR)", "DCR"]

Diodes:
  parent: [Base]
  Forward Voltage: ["Voltage - Forward(Vf)", "Vf", "Forward Voltage"]
  Reverse Voltage: [Reverse Voltage]
  Forward Current: ["Forward Current(If)", "If", "Forward Current"]

Integrated Circuits:
  parent: [Base]
  Function Type:  ["Function Type"]
  Supply Voltage: ["Supply Voltage", "Vcc"]
  Operating Temperature: [Operating Temperature]

Optoisolators:
  parent: [Base]
  Isolation Voltage: ["Isolation Voltage(Vrms)", "Isolation Voltage"]
  Current Transfer Ratio: ["Current transfer ratio", "CTR"]
  Rise Time: [Rise time]
  Fall Time: [Fall time]